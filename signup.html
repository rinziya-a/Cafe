<body>
    <div class="bg-amber-100">

                <a href="index.html"

                <a href="menu.html"

                <a href="contact.html"

            <div class="mt-6 mr-10 h-9 border-2 border-red-950 rounded-2xl px-3 pt-1">

            </div>
        </div>
        <div class="relative w-full h-full">

                    <h1 class="text-3xl font-awesome font-serif text-center text-amber-100 mb-6">

                    </h1>
                    <form action="">
                    <input type="text" placeholder="Name"
                        class="w-full border border-amber-100 p-3 rounded-lg mb-4 outline-none text-amber-100">

                        <input type="email" placeholder="Email"
                        class="w-full border border-amber-100 p-3 rounded-lg mb-4 outline-none text-amber-100">
                        <i class="fa fa-envelope absolute right-14 top-62 text-amber-100"></i>
                        <input type="password" placeholder="Password"
                        class="w-full border border-amber-100 p-3 rounded-lg mb-4 outline-none text-amber-100">
                        <i class="fa fa-lock absolute right-14 top-79 text-amber-100"></i>
                        <input type="password" placeholder="Confirm Password"
                        class="w-full border border-amber-100 p-3 rounded-lg mb-4 outline-none text-amber-100">
                        <i class="fa fa-lock absolute right-14 top-95 text-amber-100"></i> <br><br>
                       <button class="w-full bg-amber-100 border-1 border-amber-100 text-black font-semibold p-3 rounded-lg hover:bg-amber-900">
                        Sign-up
                    </button>
                    <p class="text-center font-semibold"> go back to <a href="index.html" class="text-amber-100"> <u>HOME</u></a></p>
                    </form>
